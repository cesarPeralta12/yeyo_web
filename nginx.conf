server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    server_tokens off;

    # ----- compresión -------------------------------------------------------
    # webp, png, jpg y woff2 ya vienen comprimidos: recomprimirlos sólo gasta CPU.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml
                    application/javascript application/json
                    application/xml image/svg+xml;

    include /etc/nginx/seguridad.conf;

    # ----- caché ------------------------------------------------------------
    # Los assets llevan huella de contenido en la URL (?v=…): si cambian, cambia
    # la URL, así que se pueden cachear para siempre.
    location /assets/ {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # El HTML no se cachea: es lo que apunta a las versiones nuevas de los assets.
    location ~* \.html$ {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ----- rutas ------------------------------------------------------------
    # La raíz, explícita: try_files con $uri/ dependería de la normalización
    # de la doble barra, que no está garantizada.
    location = / {
        try_files /index.html =404;
    }

    # Permite /trabajo además de /trabajo.html
    location / {
        try_files $uri $uri.html =404;
    }

    location = /robots.txt  { access_log off; expires 1d; }
    location = /sitemap.xml { expires 1d; }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Nada que servir desde archivos ocultos.
    location ~ /\.(?!well-known) { deny all; }
}
