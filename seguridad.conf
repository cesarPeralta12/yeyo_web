# Cabeceras de seguridad.
#
# Va en un archivo aparte porque en nginx un add_header dentro de un location
# descarta TODOS los heredados del bloque server. Por eso hay que incluir este
# fragmento en cada location que defina cabeceras propias, no basta con
# declararlas una vez arriba.

add_header X-Content-Type-Options "nosniff"                         always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header X-Frame-Options        "SAMEORIGIN"                      always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

# El sitio no carga nada de terceros: tipografía, estilos, scripts e imágenes
# salen de este mismo dominio. La única salida es el envío de formularios a
# formsubmit.co; si cambias de proveedor, actualiza connect-src y form-action.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self' https://formsubmit.co; form-action 'self' https://formsubmit.co; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
